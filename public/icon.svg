<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 满版绿色牌桌背景；两张牌都在中心 80% 的安全区内，系统裁成圆形或圆角都不会切到 -->
  <defs>
    <radialGradient id="felt" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#23805a"/>
      <stop offset="1" stop-color="#14513a"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#felt)"/>
  <g transform="rotate(12 256 270)" filter="url(#shadow)">
    <rect x="196" y="122" width="190" height="266" rx="22" fill="#ffffff"/>
    <path transform="translate(318 140) scale(0.5)" fill="#c62828"
      d="M50 92C50 92 8 62 8 36C8 20 20 10 33 10C42 10 48 16 50 22C52 16 58 10 67 10C80 10 92 20 92 36C92 62 50 92 50 92Z"/>
  </g>
  <g transform="rotate(-10 256 270)" filter="url(#shadow)">
    <rect x="126" y="140" width="190" height="266" rx="22" fill="#ffffff"/>
    <text x="148" y="200" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="56" fill="#1c1d1b">A</text>
    <path transform="translate(166 218) scale(1.1)" fill="#1c1d1b"
      d="M50 5C50 5 10 40 10 62C10 78 28 86 42 76C40 86 36 92 30 95L70 95C64 92 60 86 58 76C72 86 90 78 90 62C90 40 50 5 50 5Z"/>
  </g>
</svg>

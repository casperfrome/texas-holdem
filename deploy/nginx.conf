server {
    listen 80;
    server_name __IP__;
    location ^~ /.well-known/acme-challenge/ { root /var/www/texas-acme; }
    location / { return 308 https://__IP__:__PORT__$request_uri; }
}
server {
    listen __PORT__ ssl;
    server_name __IP__;
    ssl_certificate /etc/letsencrypt/live/texas-holdem-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/texas-holdem-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/texas-holdem/current/dist;
    index index.html;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
    location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
